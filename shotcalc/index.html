<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotCalc — Free Video Production Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; color: #fff; }
        .subtitle { color: #888; font-size: 1.1em; margin-bottom: 40px; }
        .tool-card { background: #1a1a1a; border-radius: 12px; padding: 30px; margin-bottom: 30px; border: 1px solid #333; }
        .tool-card h2 { color: #fff; margin-bottom: 20px; font-size: 1.4em; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input, select { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #666; }
        button { background: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background: #ddd; }
        .result { background: #0a0a0a; padding: 20px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #fff; }
        .result p { margin-bottom: 8px; }
        .result strong { color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .footer { text-align: center; color: #555; margin-top: 60px; padding: 20px; font-size: 0.9em; }
        .footer a { color: #888; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ShotCalc</h1>
        <p class="subtitle">Free production calculators for filmmakers & video creators</p>

        <div class="grid">
            <div class="tool-card">
                <h2>📹 Shot Duration Calculator</h2>
                <div class="input-group">
                    <label>Frame Rate (fps)</label>
                    <select id="fps">
                        <option value="24">24 fps (Film)</option>
                        <option value="25">25 fps (PAL)</option>
                        <option value="30" selected>30 fps (NTSC/Web)</option>
                        <option value="60">60 fps (Slow Mo)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Total Frames</label>
                    <input type="number" id="frames" placeholder="e.g. 720">
                </div>
                <button onclick="calcDuration()">Calculate</button>
                <div class="result" id="durationResult" style="display:none;"></div>
            </div>

            <div class="tool-card">
                <h2>💰 Quick Quote Estimator</h2>
                <div class="input-group">
                    <label>Video Length (minutes)</label>
                    <input type="number" id="vlength" placeholder="e.g. 10">
                </div>
                <div class="input-group">
                    <label>Complexity</label>
                    <select id="complexity">
                        <option value="50">Simple (cuts, basic color)</option>
                        <option value="100">Medium (VFX, motion graphics)</option>
                        <option value="175">Complex (heavy VFX, compositing)</option>
                    </select>
                </div>
                <button onclick="calcQuote()">Estimate</button>
                <div class="result" id="quoteResult" style="display:none;"></div>
            </div>

            <div class="tool-card">
                <h2>🎬 Aspect Ratio Calculator</h2>
                <div class="input-group">
                    <label>Width (px)</label>
                    <input type="number" id="width" placeholder="e.g. 1920">
                </div>
                <div class="input-group">
                    <label>Height (px)</label>
                    <input type="number" id="height" placeholder="e.g. 1080">
                </div>
                <button onclick="calcAR()">Calculate</button>
                <div class="result" id="arResult" style="display:none;"></div>
            </div>

            <div class="tool-card">
                <h2>⏱️ Render Time Estimator</h2>
                <div class="input-group">
                    <label>Video Length (minutes)</label>
                    <input type="number" id="rtlength" placeholder="e.g. 5">
                </div>
                <div class="input-group">
                    <label>Resolution</label>
                    <select id="resolution">
                        <option value="1080">1080p</option>
                        <option value="1440">1440p</option>
                        <option value="2160">4K</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Effects Load</label>
                    <select id="effects">
                        <option value="1">Light</option>
                        <option value="2.5">Medium</option>
                        <option value="5">Heavy</option>
                    </select>
                </div>
                <button onclick="calcRender()">Estimate</button>
                <div class="result" id="renderResult" style="display:none;"></div>
            </div>
        </div>

        <div class="footer">
            Built by <a href="mailto:hello@xheliumarray.com">X Helium Array</a> — Professional VFX & post-production
        </div>
    </div>

    <script>
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        
        function calcDuration() {
            const fps = parseFloat(document.getElementById('fps').value);
            const frames = parseFloat(document.getElementById('frames').value);
            if (!frames) return;
            const seconds = frames / fps;
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(2);
            const result = document.getElementById('durationResult');
            result.style.display = 'block';
            result.innerHTML = `<p><strong>${seconds.toFixed(2)} seconds</strong></p><p>${mins}m ${secs}s</p><p>At ${fps}fps</p>`;
        }

        function calcQuote() {
            const length = parseFloat(document.getElementById('vlength').value);
            const rate = parseFloat(document.getElementById('complexity').value);
            if (!length) return;
            const total = length * rate;
            const result = document.getElementById('quoteResult');
            result.style.display = 'block';
            result.innerHTML = `<p><strong>$${total.toLocaleString()}</strong> estimated range</p><p>${length} min × $${rate}/min</p><p>Final quote depends on shot review</p>`;
        }

        function calcAR() {
            const w = parseFloat(document.getElementById('width').value);
            const h = parseFloat(document.getElementById('height').value);
            if (!w || !h) return;
            const d = gcd(w, h);
            const rw = w / d;
            const rh = h / d;
            const ratio = (w / h).toFixed(3);
            let name = '';
            if (Math.abs(ratio - 1.778) < 0.01) name = '16:9 (Standard HD)';
            else if (Math.abs(ratio - 1.85) < 0.01) name = '1.85:1 (Widescreen)';
            else if (Math.abs(ratio - 2.39) < 0.01) name = '2.39:1 (Anamorphic)';
            else if (Math.abs(ratio - 1.333) < 0.01) name = '4:3 (Standard)';
            else if (Math.abs(ratio - 1) < 0.01) name = '1:1 (Square)';
            else if (Math.abs(ratio - 0.5625) < 0.01) name = '9:16 (Vertical/Story)';
            const result = document.getElementById('arResult');
            result.style.display = 'block';
            result.innerHTML = `<p><strong>${rw}:${rh}</strong> (${ratio})</p>${name ? `<p>${name}</p>` : ''}`;
        }

        function calcRender() {
            const length = parseFloat(document.getElementById('rtlength').value);
            const res = parseFloat(document.getElementById('resolution').value);
            const effects = parseFloat(document.getElementById('effects').value);
            if (!length) return;
            const base = length * (res / 1080) * effects * 3;
            const mins = Math.floor(base);
            const secs = Math.round((base - mins) * 60);
            const result = document.getElementById('renderResult');
            result.style.display = 'block';
            result.innerHTML = `<p><strong>~${mins}m ${secs}s</strong> estimated</p><p>Depends on hardware & codec</p>`;
        }
    </script>
</body>
</html>
